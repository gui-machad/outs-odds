<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outs & Odds</title>
<meta name="description" content="Equity, pot odds, outs e ranges de Texas Hold'em.">
<meta name="theme-color" content="#0F4F3C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Outs & Odds">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]{display:none!important}
html,body{min-height:100%}
</style>
<style>
/* Layout: uma coluna estreita, passo a passo (posição → cartas → aposta → resposta; depois flop, turn, river). Botões grandes para o polegar. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F3F6F4; --ink:#16201B; --muted:#5B6A62; --line:#D3DCD6;
  --felt:#13604A; --felt-2:#0B3F30; --felt-ink:#E6F1EB; --felt-muted:#A3C8B6; --rail:#4A3424;
  --accent:#0C7A55; --good:#16804A; --bad:#BF2F3C;
  --raise:#17824A; --raise-fill:#1E9457; --raise-soft:#DCF0E3;
  --call:#946800; --call-fill:#E9B530; --call-soft:#FBEFC6;
  --check:#2563C4; --check-fill:#3B7DD8; --check-soft:#DCE7F8;
  --fold:#C0303D; --fold-fill:#C9343F; --fold-soft:#F7DDDF;
  --hero:#E2A21F; --hero-ink:#1F1600;
  --card:#FDFEFD; --card-line:#C5D0CA;
  --s0:#1A1F1C; --s1:#C8283C; --s2:#1E5DC0; --s3:#1B7A37;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B110E; --surface:#141D19; --surface-2:#1B2621; --ink:#E3ECE7; --muted:#97A99F; --line:#2A3832;
    --felt:#0F4A38; --felt-2:#082A1F; --felt-ink:#E3F0E9; --felt-muted:#86B29E; --rail:#2E2117;
    --accent:#3AC48D; --good:#45C681; --bad:#F06C77;
    --raise:#45C681; --raise-fill:#23A866; --raise-soft:#12301F;
    --call:#F0C14B; --call-fill:#E2B232; --call-soft:#3A2F10;
    --check:#7BAEF5; --check-fill:#3D7FD9; --check-soft:#14243D;
    --fold:#F06C77; --fold-fill:#C9343F; --fold-soft:#3C171C;
    --hero:#F0B840; --hero-ink:#1F1600;
    --card:#E4EAE6; --card-line:#8FA299;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B110E; --surface:#141D19; --surface-2:#1B2621; --ink:#E3ECE7; --muted:#97A99F; --line:#2A3832;
  --felt:#0F4A38; --felt-2:#082A1F; --felt-ink:#E3F0E9; --felt-muted:#86B29E; --rail:#2E2117;
  --accent:#3AC48D; --good:#45C681; --bad:#F06C77;
  --raise:#45C681; --raise-fill:#23A866; --raise-soft:#12301F;
  --call:#F0C14B; --call-fill:#E2B232; --call-soft:#3A2F10;
  --check:#7BAEF5; --check-fill:#3D7FD9; --check-soft:#14243D;
  --fold:#F06C77; --fold-fill:#C9343F; --fold-soft:#3C171C;
  --hero:#F0B840; --hero-ink:#1F1600;
  --card:#E4EAE6; --card-line:#8FA299;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{cursor:default}
.app{max-width:560px;margin:0 auto;padding-block:14px 60px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* Topo */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:grid;place-items:center;width:28px;height:38px;border-radius:4px;background:var(--card);border:1px solid var(--card-line);color:var(--s0);font-size:18px;transform:rotate(-6deg)}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.cfgbtn{margin-left:auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.cfgbtn b{font-family:var(--f-mono);font-size:13px}
.cfg{margin-top:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cfg .full{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl label{font-size:14px;font-weight:700}
.fl .help{font-size:12px;color:var(--muted);line-height:1.3}
.inp{width:100%;min-width:0;height:50px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);padding:0 12px;font-family:var(--f-mono);font-size:19px;font-weight:500}
.pair{display:flex;align-items:center;gap:6px}
.pair span{color:var(--muted);font-family:var(--f-mono)}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.note b{font-family:var(--f-mono)}

/* Passos */
.step{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;scroll-margin-top:12px}
.step.cur{border-color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.sh{display:flex;align-items:center;gap:10px}
.badge{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 14px/30px var(--f-mono);text-align:center}
.sh h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1}
.sh .sub{color:var(--muted);font-size:14px;margin-left:auto;font-family:var(--f-mono)}
.q{font-size:19px;font-weight:700;margin:16px 0 4px;line-height:1.25;scroll-margin-top:12px}
.qhelp{font-size:14px;color:var(--muted);margin:0 0 10px}
.qhelp b{color:var(--ink)}
.done{padding:10px 12px}
.sumrow{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.sumrow .what{font-weight:700}
.sumrow .muted{color:var(--muted);font-size:14px}
.link{margin-left:auto;border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.pill{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;border-radius:6px}

/* Botões grandes */
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtn{min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:17px;font-weight:700;padding:8px;line-height:1.2}
.bigbtn.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.amts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.amt{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px}
.amt b{font-family:var(--f-mono);font-size:18px}
.amt small{font-size:12px;color:var(--muted);font-weight:600}
.amt.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.amt.sel small{color:var(--bg);opacity:.75}
.custom{display:flex;align-items:center;gap:8px;margin-top:10px}
.custom label{font-size:14px;font-weight:700;white-space:nowrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);height:50px}
.stepper button{width:48px;height:100%;border:0;background:transparent;font-size:24px;font-weight:700}
.stepper output{flex:1;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:19px}

/* Mesa de posições */
.ptable{position:relative;width:100%;aspect-ratio:1.3;max-width:460px;margin:14px auto 0}
.oval{position:absolute;inset:15% 11%;border-radius:50%;background:radial-gradient(110% 90% at 50% 35%,var(--felt) 0%,var(--felt-2) 100%);box-shadow:0 0 0 8px var(--rail),inset 0 6px 26px rgba(0,0,0,.35);display:grid;place-items:center;color:var(--felt-muted);font-size:13px;text-align:center;padding:0 18%}
.pseat{position:absolute;transform:translate(-50%,-50%);min-width:74px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:4px 8px;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:2}
.pseat b{font-family:var(--f-mono);font-size:17px}
.pseat small{font-size:11px;color:var(--muted);white-space:nowrap}
.pseat.sel{background:var(--hero);border-color:var(--hero);color:var(--hero-ink)}
.pseat.sel small{color:var(--hero-ink);opacity:.8}
.pseat.sug:not(.sel){border-color:var(--hero);border-style:dashed}
.dealer{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:#FAFAF7;color:#1A1F1C;font:700 12px/24px var(--f-mono);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.4);z-index:1}
.posinfo{margin:10px 0 0;font-size:15px}
.primary{width:100%;min-height:58px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-size:18px;font-weight:700;margin-top:12px}
.ghost{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-size:16px;font-weight:600;margin-top:8px}

/* Cartas */
.felt-strip{margin-top:14px;border-radius:14px;padding:12px;background:radial-gradient(120% 140% at 0% 0%,var(--felt) 0%,var(--felt-2) 100%);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.felt-strip .lbl{width:100%;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--felt-muted)}
.slot{width:58px;aspect-ratio:5/7;border-radius:8px;border:2px dashed color-mix(in srgb,var(--felt-ink) 40%,transparent);background:rgba(0,0,0,.2);display:grid;place-items:center;padding:0}
.slot.sm{width:48px}
.slot .nm{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--felt-muted);text-align:center;line-height:1.1}
.slot.filled{border:1px solid var(--card-line);background:var(--card);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.slot.tgt{outline:3px solid var(--hero);outline-offset:2px}
.slot.lock{opacity:.85;cursor:default}
.pc{display:flex;flex-direction:column;align-items:center;line-height:1}
.pc b{font-family:var(--f-display);font-weight:700;font-size:26px}
.pc i{font-style:normal;font-size:21px;margin-top:1px}
.slot.sm .pc b{font-size:21px}.slot.sm .pc i{font-size:17px}
.mini{display:inline-flex;gap:3px}
.mc{width:26px;aspect-ratio:5/7;border-radius:4px;background:var(--card);border:1px solid var(--card-line);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.mc b{font-family:var(--f-display);font-weight:700;font-size:14px}
.mc i{font-style:normal;font-size:10px}
.s0{color:var(--s0)}.s1{color:var(--s1)}.s2{color:var(--s2)}.s3{color:var(--s3)}
.picker{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.pick-hint{font-size:15px;margin:0}
.ranks{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.rk{min-height:50px;border-radius:10px;border:1.5px solid var(--card-line);background:var(--card);color:#1A1F1C;font-family:var(--f-display);font-weight:700;font-size:24px;padding:0}
.rk.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rk:disabled{opacity:.25}
.suits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.su{min-height:62px;border-radius:12px;border:1.5px solid var(--card-line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:4px}
.su span{font-size:30px}
.su small{font-size:12px;color:#4B5A52;margin-top:4px;font-weight:600}
.su.sel{box-shadow:0 0 0 3px var(--ink)}
.su:disabled{opacity:.25}
.deck{display:flex;flex-direction:column;gap:10px}
.suitrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (min-width:600px){.suitrow{grid-template-columns:repeat(13,minmax(0,1fr))}}
.cd{min-height:58px;border-radius:9px;border:1.5px solid var(--card-line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:2px;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.cd b{font-family:var(--f-display);font-weight:700;font-size:23px}
.cd i{font-style:normal;font-size:19px;margin-top:2px}
.cd:active{transform:scale(.95)}
.cd:disabled{opacity:.18;box-shadow:none}

/* Resposta */
.result{margin-top:16px;border-radius:16px;overflow:hidden;border:1.5px solid var(--line);scroll-margin-top:12px}
.res-top{padding:12px 12px 10px;text-align:center}
.res-act{font-family:var(--f-display);font-weight:700;font-size:68px;line-height:.95;text-transform:uppercase;letter-spacing:.02em}
.res-size{font-weight:700;font-size:19px;margin-top:4px}
.r-raise{background:var(--raise-fill);color:#fff}
.r-call{background:var(--call-fill);color:#241900}
.r-check{background:var(--check-fill);color:#fff}
.r-fold{background:var(--fold-fill);color:#fff}
.r-idle{background:var(--surface-2);color:var(--muted)}
.res-body{padding:14px;background:var(--surface)}
.res-body p{margin:0}
.reason{font-size:17px}
.meter{position:relative;height:14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);margin-top:34px}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.meter .need{position:absolute;top:-22px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.meter .need span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.meter .need.el span{left:0;transform:none}.meter .need.er span{left:auto;right:0;transform:none}
.legend{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:14px;color:var(--muted)}
.legend b{color:var(--ink);font-family:var(--f-mono)}
.calc{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;padding:18px;justify-content:center}
.calc::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:700;font-size:15px;color:var(--muted);padding:4px 0}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin:10px 0 0}
.kv div{min-width:0}
.kv dt{font-size:12px;color:var(--muted);font-weight:700}
.kv dd{margin:0;font-family:var(--f-mono);font-weight:700;font-size:17px;overflow-wrap:anywhere}
.kv dd small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.dist{margin-top:14px;display:flex;flex-direction:column;gap:5px}
.dist h3{margin:0 0 2px;font-size:12px;color:var(--muted)}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 52px;align-items:center;gap:8px;font-size:13px}
.bar .t{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar .t span{display:block;height:100%;background:var(--accent)}
.bar em{font-style:normal;font-family:var(--f-mono);text-align:right}
.outs{margin-top:14px}
.outs h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.outs .mini{flex-wrap:wrap}
.foot{margin:10px 0 0;font-size:12px;color:var(--muted)}
.others{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}
.others button{min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:700}

/* Tabela de ranges */
.range-wrap{overflow-x:auto;margin-top:10px}
.range{display:grid;grid-template-columns:repeat(13,minmax(22px,1fr));gap:2px;min-width:300px}
.rc{aspect-ratio:1;display:grid;place-items:center;font-family:var(--f-mono);font-size:clamp(8px,2vw,11px);border-radius:3px}
.rc.raise{background:var(--raise-fill);color:#fff}
.rc.call{background:var(--call-fill);color:#241900}
.rc.check{background:var(--check-fill);color:#fff}
.rc.fold{background:var(--fold-soft);color:var(--fold)}
.rc.me{outline:3px solid var(--ink);outline-offset:-1px;font-weight:700;position:relative;z-index:1}
.rlegend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.rlegend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rlegend .raise::before{background:var(--raise-fill)}.rlegend .call::before{background:var(--call-fill)}
.rlegend .check::before{background:var(--check-fill)}.rlegend .fold::before{background:var(--fold-soft);border:1px solid var(--fold)}

.endcard{text-align:center}
.endcard p{margin:6px 0 0;font-size:17px}
footer{margin-top:22px;font-size:12px;color:var(--muted)}
@media (max-width:380px){
  .pseat{min-width:64px;min-height:48px}
  .pseat b{font-size:15px}
  .res-act{font-size:58px}
  .slot{width:52px}
  .slot.sm{width:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
/* v5: mesa 2–9, range do vilão, fatos visíveis */
:root{--vil-fill:#7A4FD0;--vil-soft:#ECE4FB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--vil-fill:#8E66E0;--vil-soft:#261A3D}}
:root[data-theme="dark"]{--vil-fill:#8E66E0;--vil-soft:#261A3D}
.nplay{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:8px}
.chip{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:16px;font-family:var(--f-mono);padding:4px 6px}
.chip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips .chip{font-family:var(--f-body);font-size:15px;padding:6px 12px}
.chips .chip small{display:block;font-size:11px;font-weight:600;opacity:.75}
.ptable.many{aspect-ratio:1.12}
.ptable.many .pseat{min-width:58px;min-height:44px;padding:2px 5px;border-radius:12px}
.ptable.many .pseat b{font-size:14px}
.ptable.many .pseat small{font-size:10px}
.facts{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.facts li{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:15px}
.facts li .ic{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--f-mono);background:var(--ink);color:var(--bg)}
.facts li .ic.v{background:var(--vil-fill);color:#fff}
.facts li b{font-family:var(--f-mono)}

<script>
// ENGINE START
const RANKS = "23456789TJQKA";
const rc = new Int8Array(13), sc = new Int8Array(4), sm = new Int32Array(4);
function straightHigh(mask){
  for (let h = 12; h >= 4; h--){ const m = 0x1F << (h - 4); if ((mask & m) === m) return h; }
  if ((mask & 0x100F) === 0x100F) return 3;
  return -1;
}
function kickers(val, shift, count, a, b){
  for (let r = 12; r >= 0 && count > 0; r--){
    if (rc[r] && r !== a && r !== b){ val |= (r + 1) << shift; shift -= 4; count--; }
  }
  return val;
}
function evalCards(cards, n){
  rc.fill(0); sc.fill(0); sm.fill(0); let mask = 0;
  for (let i = 0; i < n; i++){ const c = cards[i], r = c >> 2, s = c & 3; rc[r]++; sc[s]++; sm[s] |= 1 << r; mask |= 1 << r; }
  let fs = -1; for (let s = 0; s < 4; s++) if (sc[s] >= 5){ fs = s; break; }
  if (fs >= 0){ const h = straightHigh(sm[fs]); if (h >= 0) return (8 << 20) | ((h + 1) << 16); }
  let quad = -1, t1 = -1, t2 = -1, p1 = -1, p2 = -1;
  for (let r = 12; r >= 0; r--){
    const k = rc[r];
    if (k === 4){ if (quad < 0) quad = r; }
    else if (k === 3){ if (t1 < 0) t1 = r; else if (t2 < 0) t2 = r; }
    else if (k === 2){ if (p1 < 0) p1 = r; else if (p2 < 0) p2 = r; }
  }
  if (quad >= 0) return kickers((7 << 20) | ((quad + 1) << 16), 12, 1, quad, -1);
  if (t1 >= 0 && (t2 >= 0 || p1 >= 0)){ const pr = Math.max(t2, p1); return (6 << 20) | ((t1 + 1) << 16) | ((pr + 1) << 12); }
  if (fs >= 0){
    let v = 5 << 20, sh = 16, cnt = 5; const fm = sm[fs];
    for (let r = 12; r >= 0 && cnt > 0; r--) if (fm & (1 << r)){ v |= (r + 1) << sh; sh -= 4; cnt--; }
    return v;
  }
  const st = straightHigh(mask); if (st >= 0) return (4 << 20) | ((st + 1) << 16);
  if (t1 >= 0) return kickers((3 << 20) | ((t1 + 1) << 16), 12, 2, t1, -1);
  if (p1 >= 0 && p2 >= 0) return kickers((2 << 20) | ((p1 + 1) << 16) | ((p2 + 1) << 12), 8, 1, p1, p2);
  if (p1 >= 0) return kickers((1 << 20) | ((p1 + 1) << 16), 12, 3, p1, -1);
  return kickers(0, 16, 5, -1, -1);
}
function makeSim(hero, board, opps){
  const known = new Set([...hero, ...board]);
  const deck = []; for (let c = 0; c < 52; c++) if (!known.has(c)) deck.push(c);
  const D = Int8Array.from(deck), dn = D.length, bl = board.length, needBoard = 5 - bl, need = needBoard + 2 * opps;
  const hb = new Int8Array(7), ob = new Int8Array(7);
  hb[0] = hero[0]; hb[1] = hero[1];
  for (let i = 0; i < bl; i++){ hb[2 + i] = board[i]; ob[2 + i] = board[i]; }
  const acc = { n: 0, wins: 0, ties: 0, share: 0, cat: new Float64Array(9) };
  acc.step = function(iters){
    for (let it = 0; it < iters; it++){
      for (let i = 0; i < need; i++){ const j = i + ((Math.random() * (dn - i)) | 0); const t = D[i]; D[i] = D[j]; D[j] = t; }
      let k = 0;
      for (let i = 0; i < needBoard; i++){ const c = D[k++]; hb[2 + bl + i] = c; ob[2 + bl + i] = c; }
      const hs = evalCards(hb, 7); acc.cat[hs >> 20]++;
      let nt = 0, lost = false;
      for (let o = 0; o < opps; o++){
        ob[0] = D[k++]; ob[1] = D[k++];
        const s = evalCards(ob, 7);
        if (s > hs){ lost = true; break; }
        if (s === hs) nt++;
      }
      if (!lost){ if (nt === 0) acc.wins++; else { acc.ties++; acc.share += 1 / (nt + 1); } }
    }
    acc.n += iters;
  };
  return acc;
}
function computeOuts(hero, board){
  if (board.length < 3 || board.length > 4) return null;
  const known = new Set([...hero, ...board]);
  const cur = evalCards([...hero, ...board], 2 + board.length) >> 20;
  const boardRanks = new Set(board.map(c => c >> 2));
  const list = [];
  for (let c = 0; c < 52; c++){
    if (known.has(c)) continue;
    const hc = evalCards([...hero, ...board, c], 3 + board.length) >> 20;
    const bc = evalCards([...board, c], 1 + board.length) >> 20;
    if (hc <= cur || hc <= bc) continue;
    if (hc === 2 && boardRanks.has(c >> 2)) continue;
    list.push({ c, cat: hc });
  }
  const unseen = 52 - known.size, n = list.length;
  const prob = board.length === 3 ? 1 - ((unseen - n) * (unseen - n - 1)) / (unseen * (unseen - 1)) : n / unseen;
  return { list, n, prob, rule: Math.min(board.length === 3 ? n * 4 : n * 2, 100), cur };
}

/* ---------- Equity contra um range ---------- */
function makeSimRange(hero, board, opps, combos){
  const bl = board.length, needBoard = 5 - bl, used = new Uint8Array(52), base = new Uint8Array(52);

    for (let it = 0; it < iters; it++){

      }

      const hs = evalCards(hb, 7); acc.cat[hs >> 20]++;
      let nt = 0, lost = false;
      for (let o = 0; o < opps; o++){

      }
      if (!lost){ if (nt === 0) acc.wins++; else { acc.ties++; acc.share += 1 / (nt + 1); } }
    }
    acc.n += iters;
  };
  return acc;

    : { action: "Fold", mode, reason: `${code} não é boa o bastante para jogar do ${p} numa mesa de ${S.cfg.players}. Largue a mão.` };
  const ci = callInfo(d);
  if (mode === "vsraise"){
    if (act === "raise") return { action: "Raise", ...sized(d, (3 + cl) * V + lim * bb), mode, reason: `Aumentaram para ${money(V)}, mas ${code} está entre as melhores mãos: aumente de novo (3-bet).` };
    if (act === "call") return { action: "Call", ...ci, mode, reason: `${code} joga bem, mas não para aumentar de novo. Pague e veja o flop.` };
    return { action: "Fold", mode, reason: `Contra um aumento, ${code} perde dinheiro no longo prazo. Largue.` };
  }
  if (mode === "vs3bet"){
    if (act === "raise") return { action: "Raise", ...sized(d, 2.3 * V), mode, reason: `Aumentaram por cima para ${money(V)}. ${code} é das mais fortes: aumente de novo (4-bet).` };
    if (act === "call") return { action: "Call", ...ci, mode, reason: `Aumentaram por cima (3-bet). ${code} é boa para pagar e ver o flop, mas não para aumentar de novo.` };
    return { action: "Fold", mode, reason: `Aumentaram por cima (3-bet). Contra isso, ${code} não aguenta: largue.` };
  }

function verdictPost(d, e){
  const P = potNow(d), tc = toCall(d), opps = Math.max(1, S.vills.length), fair = 1 / (opps + 1), eq = e.eq;
  if (tc > 0){
    const ci = callInfo(d), req = ci.add / (P + ci.add), base = { req, eq, hasBet: true };
    if (eq >= req){
      const strong = eq >= Math.max(req + 0.2, fair + (1 - fair) * 0.35);
      if (strong && !ci.allin) return { ...base, action: "Raise", ...sized(d, 3 * d.villStreet), reason: `Você ganha ${pct(eq)} das vezes e só precisa de ${pct(req)}. Sua mão está bem na frente: aumente.` };
      return { ...base, action: "Call", ...ci, reason: `Para pagar ${money(ci.add)} você precisa ganhar ${pct(req)} das vezes. Você ganha ${pct(eq)}: pague.` };
    }
    if (S.cur !== "river" && !ci.allin && eq > 0 && eq >= req - 0.07){
      const implied = (ci.add - eq * (P + ci.add)) / eq;
      return { ...base, action: "Fold", marginal: true, reason: `Quase dá para pagar: falta pouco (${pct(req - eq)}). Só pague se o vilão costuma pagar muito quando você acerta: você teria que ganhar mais ${money(implied)} depois.` };
    }
    return { ...base, action: "Fold", reason: `Você precisa ganhar ${pct(req)} das vezes e ganha só ${pct(eq)}. Largue.` };
  }
  const L = left();
  if (L > 0 && L <= P * 0.35 && eq >= 0.3) return { req: fair, eq, hasBet: false, action: "Aposte", ...sized(d, d.heroStreet + L), reason: `Sobraram só ${money(L)} no seu stack e o pote já tem ${money(P)}. Você ganha ${pct(eq)} das vezes: vá all-in.` };
  const th = fair + (1 - fair) * 0.2;
  if (eq >= th) return { req: fair, eq, hasBet: false, action: "Aposte", ...sized(d, d.villStreet + P * 0.66), reason: `Você ganha ${pct(eq)} das vezes, mais que a sua parte do pote (${pct(fair)} com ${opps + 1} na mão). Aposte para ganhar fichas de quem tem mão pior.` };
  return { req: fair, eq, hasBet: false, action: "Check", reason: `Você ganha ${pct(eq)} das vezes. É pouco para apostar contra ${opps} ${opps > 1 ? "jogadores" : "jogador"}: dê check.` };

const TONE = { Raise: "raise", Aposte: "raise", Call: "call", Check: "check", Fold: "fold" };
function sizeText(v){
  if (v.action === "Raise") return v.allin ? `All-in: ${money(v.to)}` : `Aumente para ${money(v.to)}`;
  if (v.action === "Aposte") return v.allin ? `All-in: ${money(v.to)}` : `Aposte ${money(v.to)} (⅔ do pote)`;
  if (v.action === "Call") return v.allin ? `Pague all-in: ${money(v.add)}` : `Pague ${money(v.add)}`;

}
function getVerdict(s){

  if (s === "pre") return verdictPre(d);

function defaultTo(s, d){

/* ---------- Ações no pré-flop ---------- */
const lvlBase = lv => lv <= 1 ? "callopen" : lv === 2 ? "call3bet" : "call4bet";
function preHero(t, to){
  const d = S.st.pre;
  d.heroActed = true; S.ui.heroAmt = false;
  if (t === "fold"){ d.log.push({ w: "hero", t: "Você largou" }); return endHand("fold"); }
  if (t === "check"){ d.log.push({ w: "hero", t: "Você deu check" }); return finishPre(); }
  if (t === "call"){
    const ci = callInfo(d); d.heroStreet = r2(d.heroStreet + ci.add);
    d.log.push({ w: "hero", t: d.level === 0 ? `Você só pagou o blind (${money(ci.add)})` : `Você pagou ${money(ci.add)}${ci.allin ? " (all-in)" : ""}` });
    const pend = d.others.filter(o => !o.folded && o.a < d.villStreet);
    if (pend.length){ d.phase = "callpre"; S.scrollTo = "q-pre"; return; }
    return finishPre();
  }
  const z = sized(d, to);
  d.heroStreet = z.to; d.level++;
  d.log.push({ w: "hero", t: `Você aumentou para ${money(z.to)}${z.allin ? " (all-in)" : ""}` });

}
// Depois do seu aumento: k pagaram (os que mais colocaram primeiro)
function preCalled(k){
  const d = S.st.pre, T = d.heroStreet, base = lvlBase(d.level);
  const chosen = topOthers(d, k);
  d.others.forEach((o, i) => { if (chosen.includes(i)){ o.a = T; o.base = o.w === "BB" && d.level === 1 ? "bbdef" : base; o.vol = true; } else if (!o.folded) o.folded = true; });
  for (let i = chosen.length; i < k; i++) d.others.push({ w: `Jogador ${i + 1}`, a: T, base, vol: true });
  syncPre(d);
  d.log.push({ w: "vil", t: k > 1 ? `${k} pagaram` : "1 pagou" });
  finishPre();
}
function preOver(x){
  const d = S.st.pre, i = topOthers(d, 1)[0];
  const o = i != null ? d.others[i] : (d.others.push({ w: "Quem aumentou", a: 0 }), d.others[d.others.length - 1]);
  d.others.forEach(q => { if (q !== o && !q.folded && q.a < d.heroStreet) q.folded = true; });
  d.level++; o.a = r2(x); o.base = d.level >= 3 ? "4bet" : "3bet"; o.vol = true; o.raiser = true;
  syncPre(d);
  d.log.push({ w: "vil", t: `${o.w} aumentou por cima para ${money(x)}` });
  d.phase = "decide"; d.respMode = null; S.scrollTo = "res-pre";

// Depois do seu call: quantos dos que estavam com menos fichas também pagaram
function preCallers(k){
  const d = S.st.pre, V = d.villStreet;
  const pend = topOthers(d, 99, o => o.a >= V);
  pend.forEach((i, j) => { const o = d.others[i]; if (j < k){ o.a = V; o.vol = true; if (o.base === "limp" && d.level >= 1) o.base = "callopen"; } else o.folded = true; });
  syncPre(d);

/* ---------- Ações depois do flop ---------- */
function postHero(t, to){
  const s = S.cur, d = S.st[s]; S.ui.heroAmt = false;
  if (t === "fold"){ d.log.push({ w: "hero", t: "Você largou" }); return endHand("fold"); }
  if (t === "call"){ const ci = callInfo(d); d.heroStreet = r2(d.heroStreet + ci.add); d.log.push({ w: "hero", t: `Você pagou ${money(ci.add)}${ci.allin ? " (all-in)" : ""}` }); return streetDone(); }
  if (t === "check"){ d.log.push({ w: "hero", t: "Você deu check" }); d.phase = "resp"; d.respMode = "check"; d.respAsk = null; S.scrollTo = "q-" + s; return; }
  const z = sized(d, to), wasBet = toCall(d) === 0;
  d.heroStreet = z.to;
  d.log.push({ w: "hero", t: `${wasBet ? "Você apostou" : "Você aumentou para"} ${money(z.to)}${z.allin ? " (all-in)" : ""}` });
  d.phase = "resp"; d.respMode = "bet"; d.respAsk = null; S.scrollTo = "q-" + s;
}
function postCalled(k){
  const s = S.cur, d = S.st[s], T = d.heroStreet, board = boardFor(s);
  k = Math.max(1, k);
  S.vills = S.vills.slice(0, k);
  while (S.vills.length < k) S.vills.push(mkV(`Jogador ${S.vills.length + 1}`, "normal"));
  S.vills.forEach(v => vAct(v, "call", board));
  d.extra = r2((d.extra || 0) + (k - 1) * T);
  d.villStreet = T;
  d.log.push({ w: "vil", t: k > 1 ? `${k} pagaram` : "Pagou" });
  streetDone();
}
function postOver(x, who){
  const s = S.cur, d = S.st[s], board = boardFor(s);
  d.villStreet = r2(x);
  let v = S.vills[who || 0] || mkV("Vilão", "normal");
  vAct(v, "raise", board);
  S.vills = [v]; d.extra = 0;
  d.log.push({ w: "vil", t: `${v.label} aumentou por cima para ${money(x)}` });
  d.phase = "decide"; d.respMode = null; S.scrollTo = "res-" + s;
}
function postChecked(){
  const s = S.cur, d = S.st[s];
  S.vills.forEach(v => vAct(v, "check", boardFor(s)));
  d.log.push({ w: "vil", t: "Todos deram check" });
  streetDone();
}
function villBet(x, who, callers){
  const s = S.cur, d = S.st[s], board = boardFor(s);
  if (!S.vills.length) S.vills = [mkV("Vilão", "normal")];
  who = Math.min(who || 0, S.vills.length - 1);
  const bettor = S.vills[who];
  vAct(bettor, "bet", board);
  const others = S.vills.filter((_, i) => i !== who), c = Math.min(callers || 0, others.length);
  others.slice(0, c).forEach(v => vAct(v, "call", board));
  S.vills = [bettor, ...others];
  d.villStreet = r2(x); d.extra = r2((d.extra || 0) + c * x);
  d.log.push({ w: "vil", t: `${bettor.label} apostou ${money(x)}${c ? ` e ${c} ${c > 1 ? "pagaram" : "pagou"} antes de você` : ""}` });
  d.phase = "decide"; d.respMode = null; S.scrollTo = "res-" + s;
}
function streetDone(){

  let bars = "";
  for (let k = 8; k >= 0; k--){ const p = vn.cat[k]; if (p < 0.005) continue; bars += `<div class="bar vb ${k > vn.heroCat ? "ahead" : ""}"><span>${CAT_V[k]}</span><div class="t"><span style="width:${(p * 100).toFixed(1)}%"></span></div><em>${pct(p)}</em></div>`; }
  const tc = toCall(d), hasBet = tc > 0, c = hasBet ? callInfo(d).add : 0, P = potNow(d);
  const ev = hasBet ? e.eq * (P + c) - c : 0, L = left(), spr = L > 0 && P > 0 ? L / P : 0;
  return h + `<div class="panel2"><h3>O que ${main.label} pode ter</h3><p class="lead">O range muda com o que ele fez. Em negrito, o que ganha do seu jogo.</p><div class="dist">${bars}</div>${villChart(main, code)}</div>
    <div class="panel2"><h3>Números</h3><dl class="kv">
      <div><dt>Você ganha / empata</dt><dd>${pct(e.win, 1)} / ${pct(e.tie, 1)}</dd></div>
      <div><dt>EV do call</dt><dd class="${hasBet ? (ev >= 0 ? "pos" : "neg") : ""}">${hasBet ? (ev >= 0 ? "+" : "") + money(ev) : "—"}</dd></div>
      <div><dt>Odds do pote</dt><dd>${hasBet ? `${fmtNum(P / c, 1)} : 1` : "—"}</dd></div>
      <div><dt>SPR</dt><dd>${spr ? fmtNum(spr, 1) : "—"}<small>${spr ? (spr <= 3 ? "baixo: top pair já pode ir all-in" : spr <= 8 ? "médio" : "alto: só mão muito forte vai all-in") : ""}</small></dd></div>
    </dl></div>`;
}
function cfgHTML(){
  return `<div class="cfg">
    <div class="fl"><label>Blinds</label><div class="pair"><input class="inp" id="c-sb" inputmode="decimal" value="${fmtNum(S.cfg.sb, 2)}" aria-label="Small blind"><span>/</span><input class="inp" id="c-bb" inputmode="decimal" value="${fmtNum(S.cfg.bb, 2)}" aria-label="Big blind"></div><span class="help">Small / big. Ex.: 1/2</span></div>
    <div class="fl"><label for="c-buyin">Buy-in total</label><input class="inp" id="c-buyin" inputmode="decimal" value="${fmtNum(S.cfg.buyin, 2)}"><span class="help">Quanto comprou na sessão, com recompras.</span></div>
    <div class="fl"><label for="c-stack">Seu stack agora</label><input class="inp" id="c-stack" inputmode="decimal" value="${fmtNum(S.cfg.stack, 2)}"><span class="help">Atualiza sozinho quando você marca Ganhei/Perdi.</span></div>
    <div class="fl"><label for="c-vstack">Stack do vilão</label><input class="inp" id="c-vstack" inputmode="decimal" value="${fmtNum(S.cfg.vstack, 2)}"><span class="help">Do adversário principal.</span></div>
    <div class="fl full"><label>Jogadores na mesa</label><div class="nplay">${[2,3,4,5,6,7,8,9].map(k => `<button type="button" class="chip ${S.cfg.players === k ? "sel" : ""}" data-act="players" data-n="${k}">${k}</button>`).join("")}</div></div>
    <div class="note full" id="cfgNote">${cfgNote()}</div>
    <button type="button" class="primary full" data-act="cfg" style="margin-top:0">Fechar</button>
  </div>`;
}
function cfgNote(){
  const diff = S.cfg.stack - S.cfg.buyin;
  return `Na sessão: <b class="${diff >= 0 ? "pos" : "neg"}">${diff >= 0 ? "+" : "−"}${money(Math.abs(diff))}</b>. Seu stack: <b>${money(S.cfg.stack)}</b>. Stack efetivo (o máximo em jogo contra o vilão): <b>${money(eff())}</b>.`;
}
function afterRender(){
  if (S.scrollTo){
    const id = S.scrollTo; S.scrollTo = null;
    requestAnimationFrame(() => { const el = $(id) || $("result-" + S.cur); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); });
  }
}

/* ---------- Eventos ---------- */
const readNum = v => { let s = String(v).trim(); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); const n = parseFloat(s); return isFinite(n) && n > 0 ? n : 0; };
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act, s = S.cur, ready = heroOK() && S.pos && !S.editPos;
  const d = ready ? (s === "pre" ? pre() : S.st[s]) : null;
  const val = () => b.dataset.custom ? readNum(($("famt") || {}).value || "") : +b.dataset.v;
  switch (act){
    case "cfg": S.showCfg = !S.showCfg; break;
    case "players": {
      S.cfg.players = +b.dataset.n;
      if (S.pos && !order().includes(S.pos)){ S.pos = null; S.editPos = true; }
      if (S.vrPos && !order().includes(S.vrPos)) S.vrPos = null;
      save(); if (S.st.pre && !S.st.pre.heroActed) buildPre(S.st.pre); break;
    }
    case "pos": S.pos = b.dataset.p; S.sugPos = null; S.editPos = false; S.autoPos = false; save(); if (S.st.pre && !S.st.pre.heroActed){ S.vrPos = null; buildPre(S.st.pre); } S.scrollTo = heroOK() ? "st-" + S.cur : "st-hand"; break;
    case "editpos": S.editPos = true; break;
    case "edithand": S.editHand = true; S.scrollTo = "st-hand"; break;
    case "handok": S.editHand = false; S.scrollTo = "st-" + S.cur; break;
    case "card": placeCard(+b.dataset.c); break;
    case "slot": { const i = +b.dataset.i; if (b.dataset.k === "hero"){ S.hero[i] = null; S.editHand = true; } else S.board[i] = null; break; }
    case "undo": { const x = TL.pop(); if (x) restoreState(x.snap); break; }
    case "tl": { const i = +b.dataset.i, x = TL[i]; if (x){ restoreState(x.snap); TL.length = i; } S.ui.hist = false; break; }
    case "hist": S.ui.hist = !S.ui.hist; break;
    case "custom": S.ui.custom = S.ui.custom === b.dataset.k ? null : b.dataset.k; break;
    case "more": S.ui.more = !S.ui.more; break;
    case "more2": S.ui.more2 = !S.ui.more2; break;
    case "why": S.ui.why = !S.ui.why; break;
    case "heroask": S.ui.heroAmt = !S.ui.heroAmt; break;
    // pré-flop: formulário
    case "limpers": if (!d) return; d.limpers = +b.dataset.n; buildPre(d); break;
    case "noraise": if (!d) return; d.raise = null; d.callers = 0; S.vrPos = null; buildPre(d); d.phase = "decide"; S.ui.custom = null; S.scrollTo = "res-pre"; break;
    case "raise": { if (!d) return; const v = val(); if (!(v > 0)) return; d.raise = r2(v); buildPre(d); d.phase = "decide"; S.ui.custom = null; S.scrollTo = "res-pre"; break; }
    case "raiser": if (!d) return; S.vrPos = b.dataset.p || null; if (d.callers > maxCallers()) d.callers = maxCallers(); buildPre(d); break;
    case "callers": if (!d) return; d.callers = +b.dataset.n; buildPre(d); break;
    // pré-flop: respostas
    case "pcalled": preCalled(+b.dataset.k); break;
    case "pover": d.respAsk = d.respAsk === "over" ? null : "over"; break;
    case "povamt": { const v = val(); if (!(v > d.heroStreet)) return; S.ui.custom = null; preOver(v); break; }
    case "pfold": d.log.push({ w: "vil", t: "Todos largaram" }); endHand("won"); break;
    case "pcallers": preCallers(+b.dataset.k); break;
    // depois do flop
    case "nobet": d.log = [{ w: "vil", t: "Ninguém apostou" }]; d.phase = "decide"; S.scrollTo = "res-" + s; break;
    case "vbet": { const v = val(); if (!(v > 0)) return; S.ui.custom = null; S.ui.more = false; villBet(v, d.bettor || 0, d.pre || 0); break; }
    case "vbet2": { const v = val(); if (!(v > 0)) return; S.ui.custom = null; villBet(v, 0, 0); break; }
    case "bettor": d.bettor = +b.dataset.n; break;
    case "precall": d.pre = +b.dataset.n; break;
    case "overwho": d.overWho = +b.dataset.n; break;
    case "vcalled": postCalled(+b.dataset.k); break;
    case "vover": d.respAsk = d.respAsk === "over" ? null : "over"; break;
    case "vovamt": { const v = val(); if (!(v > d.heroStreet)) return; S.ui.custom = null; postOver(v, d.overWho || 0); break; }
    case "vfold": d.log.push({ w: "vil", t: "Todos largaram" }); endHand("won"); break;
    case "vchecked": postChecked(); break;
    case "vcount": {
      const dd = +b.dataset.d;
      if (dd > 0 && S.vills.length < nOthers()) S.vills.push(mkV(`Jogador ${S.vills.length + 1}`, "normal"));
      if (dd < 0 && S.vills.length > 1) S.vills.pop();
      if (S.editV != null && S.editV >= S.vills.length) S.editV = null;
      RV++; break;
    }
    case "editv": { const i = +b.dataset.n; S.editV = S.editV === i ? null : i; break; }
    case "vbase": { const v = S.vills[S.editV]; if (v){ v.base = b.dataset.k; recalc(v); } break; }
    // você
    case "hero": { if (!d) return; S.ui.why = false; const t = b.dataset.t, to = b.dataset.to ? +b.dataset.to : 0; if (s === "pre") preHero(t, to); else postHero(t, to); break; }
    case "heroamt": { if (!d) return; const v = val(); if (!(v > 0)) return; S.ui.custom = null; if (s === "pre") preHero("raise", v); else postHero("raise", v); break; }
    case "result": { const r = b.dataset.r; applyResult(r === "won" ? S.end.pot : r === "split" ? S.end.pot / 2 : 0); break; }
    case "goto": { const i = TL.findIndex(x => x.label.startsWith(SNAME[b.dataset.s] + ":")); if (i >= 0){ restoreState(TL[i].snap); TL.length = i; } S.scrollTo = "st-" + S.cur; break; }
    case "new": newHand(); break;
    default: return;
  }
  render();
});
document.addEventListener("input", e => {
  const id = e.target.id || "";
  if (id.startsWith("c-")){
    const k = id.slice(2); S.cfg[k] = readNum(e.target.value); save();
    const p0 = S.st.pre;
    if (!p0 || !p0.heroActed){ S.handStack = S.cfg.stack; S.vstackStart = S.cfg.vstack; if (p0) buildPre(p0); }
    $("cfgBtn").innerHTML = cfgBtnHTML();
    const n = $("cfgNote"); if (n) n.innerHTML = cfgNote();
    return;
  }
  if (id.startsWith("pot-")){
    const d = S.st[id.slice(4)];
    if (d){ d.potStart = readNum(e.target.value); const sub = document.querySelector(`#st-${id.slice(4)} .sh .sub`); if (sub) sub.textContent = `pote ${money(potNow(d))}`; renderResult(S.cur); }
  }
});

render();

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
